<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sync running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8B1D1D}a:hover{color:#6B1515}
</style>
</helmet>
<div style="width: 390px; height: 980px; display: flex; flex-direction: column; background: #F5F3F0; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1917; overflow: hidden">
  <header style="background: #8B1D1D; color: #FFFFFF; padding: 8px 8px 10px; display: flex; align-items: center; gap: 2px">
    <span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0"></span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 19px; line-height: 24px; font-weight: 600">Sync</h1>
      <span style="font-size: 13px; line-height: 18px; color: #F3DADA">Running · keep the app open</span>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Progress" style="background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><b>Sending receipts</b><span style="color: #57534E">Step 5 of 15</span></div>
      <div role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="5" aria-label="Sync progress" style="height: 8px; background: #F1EDE4; border-radius: 999px; overflow: hidden"><div style="width: 33%; height: 8px; background: #8B1D1D"></div></div>
      <span style="font-size: 13px; color: #57534E">Receipt 1 of 2 · Lakshmi Traders</span>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 14px; overflow: hidden">
      <h2 style="margin: 0; padding: 10px 16px 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #8B1D1D">SEND</h2>
      <sc-for list="{{send}}" as="st" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid #F1EDE4; font-size: 14px">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{st.bg}}; color: {{st.fg}}">{{st.mark}}</span>
          <span style="flex: 1; color: {{st.text}}">{{st.name}}</span>
          <span style="font-size: 13px; color: #57534E">{{st.count}}</span>
        </div>
      </sc-for>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 14px; overflow: hidden">
      <h2 style="margin: 0; padding: 10px 16px 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #8B1D1D">THEN RECEIVE</h2>
      <sc-for list="{{recv}}" as="st" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid #F1EDE4; font-size: 14px">
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #F1EDE4; color: #57534E">·</span>
          <span style="flex: 1; color: #57534E">{{st}}</span>
        </div>
      </sc-for>
    </section>
  </div>

  <footer style="background: #FFFFFF; border-top: 1px solid #E7E5E4; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <a href="Sync.dc.html" style="height: 48px; border-radius: 12px; border: 1px solid #8B1D1D; background: #FFFFFF; color: #8B1D1D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Stop after this step</a>
    <span style="font-size: 12px; line-height: 16px; color: #57534E; text-align: center">If the Wi-Fi drops, tap Sync now again. Nothing is sent twice.</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const done = { mark: '✓', bg: '#DCFCE7', fg: '#166534', text: '#1C1917' };
    const now = { mark: '•', bg: '#8B1D1D', fg: '#FFFFFF', text: '#1C1917' };
    const wait = { mark: '·', bg: '#F1EDE4', fg: '#57534E', text: '#57534E' };
    return {
      send: [
        { name: 'Sign in to VK Nex', count: '', ...done },
        { name: 'Customers', count: '1 sent', ...done },
        { name: 'Sales orders', count: '2 sent', ...done },
        { name: 'Sales bills', count: '1 sent', ...done },
        { name: 'Receipts', count: '1 of 2', ...now },
        { name: 'Sales returns', count: '1', ...wait },
        { name: 'No order visits', count: '1', ...wait }
      ],
      recv: ['Settings and your login', 'Customers and credit', 'Items, prices and stock', 'Customer rates and qty prices', 'Schemes', 'Open bills', 'Order status', 'Ledgers']
    };
  }
}
</script>
</body>
</html>
