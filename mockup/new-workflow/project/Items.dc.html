<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sales order items</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8B1D1D}a:hover{color:#6B1515}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F5F3F0; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1917; overflow: hidden">
  <header style="background: #8B1D1D; color: #FFFFFF; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 2px">
      <a href="Customer.dc.html" aria-label="Back to customer" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <h1 style="margin: 0; font-size: 19px; line-height: 24px; font-weight: 600">Sales order</h1>
        <span style="font-size: 13px; line-height: 18px; color: #F3DADA">Sri Murugan Stores · Retail price</span>
      </div>
      <button type="button" aria-label="Scan barcode" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"/></svg></button>
    </div>
    <div style="margin: 0 8px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; background: #FFFFFF; color: #57534E">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input aria-label="Search items" placeholder="Search item, code or தமிழ் name" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; color: #1C1917; background: transparent">
    </div>
  </header>

  <div style="display: flex; gap: 8px; padding: 12px 16px 6px; overflow: hidden">
    <button type="button" aria-pressed="true" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8B1D1D; background: #F8E8E8; color: #8B1D1D; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap">All</button>
    <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 13px; white-space: nowrap">Oils</button>
    <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 13px; white-space: nowrap">Pulses</button>
    <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 13px; white-space: nowrap">Beverages</button>
    <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 13px; white-space: nowrap">Brand</button>
  </div>
  <span style="padding: 0 16px 8px; font-size: 12px; color: #57534E">Prices and stock as at Sync 08:42</span>

  <div style="flex: 1; overflow: hidden; background: #FFFFFF; border-top: 1px solid #E7E5E4">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
      <a href="ItemLine.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #F1EDE4; text-decoration: none; color: #1C1917">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
          <span style="font-size: 13px; color: #44403C; font-variant-numeric: tabular-nums">{{it.unit}} · <b>₹{{it.rate}}</b> · MRP ₹{{it.mrp}}</span>
          <span style="font-size: 12px; color: {{it.stockColor}}">{{it.stock}}</span>
          <sc-if value="{{it.tag}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; margin-top: 2px; padding: 1px 8px; border-radius: 6px; background: #F8E8E8; color: #6B1515; font-size: 12px; font-weight: 600">{{it.tag}}</span></sc-if>
        </div>
        <sc-if value="{{it.qty}}" hint-placeholder-val="{{true}}">
          <span aria-label="In order: {{it.qty}}" style="min-width: 44px; height: 36px; padding: 0 10px; box-sizing: border-box; border-radius: 10px; background: #8B1D1D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{it.qty}}</span>
        </sc-if>
        <sc-if value="{{it.add}}" hint-placeholder-val="{{false}}">
          <span style="min-width: 44px; height: 36px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid #8B1D1D; color: #8B1D1D; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Add</span>
        </sc-if>
      </a>
    </sc-for>
  </div>

  <footer style="background: #FFFFFF; border-top: 1px solid #E7E5E4; padding: 10px 16px 12px; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #57534E">4 items · 36 qty</span>
      <b style="font-size: 19px; font-variant-numeric: tabular-nums">₹5,054.00</b>
    </div>
    <a href="OrderReview.dc.html" style="height: 48px; padding: 0 22px; border-radius: 12px; background: #8B1D1D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Review order</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = '#57534E';
    const out = '#B91C1C';
    return {
      items: [
        { name: 'Sunflower Oil 1 L', unit: 'Pouch', rate: '155.00', mrp: '175.00', stock: 'Stock 240', stockColor: ok, tag: 'Scheme on bills: buy 12 get 1', qty: '12', add: false },
        { name: 'Toor Dal 1 kg', unit: 'Pack', rate: '142.00', mrp: '160.00', stock: 'Stock 85', stockColor: ok, tag: 'Qty price ₹139.00 from 24', qty: '10', add: false },
        { name: 'Tea Powder 250 g', unit: 'Pack', rate: '118.00', mrp: '130.00', stock: 'Stock 64', stockColor: ok, tag: 'Scheme on bills: 5% off', qty: '6', add: false },
        { name: 'Detergent Powder 1 kg', unit: 'Pack', rate: '95.00', mrp: '110.00', stock: 'Stock 120', stockColor: ok, tag: '', qty: '8', add: false },
        { name: 'Basmati Rice 5 kg', unit: 'Bag', rate: '520.00', mrp: '599.00', stock: 'Stock 18', stockColor: ok, tag: '', qty: '', add: true },
        { name: 'Sugar 1 kg', unit: 'Pack', rate: '44.00', mrp: '50.00', stock: 'No stock · can still be ordered', stockColor: out, tag: '', qty: '', add: true }
      ]
    };
  }
}
</script>
</body>
</html>
