<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter shops</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8B1D1D}a:hover{color:#6B1515}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #57534E; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1917; overflow: hidden">
  <a href="Today.dc.html" aria-label="Close filter and go back to Today" style="height: 96px; flex-shrink: 0; display: block"></a>
  <section aria-label="Filter shops" style="flex: 1; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 20px 20px 0 0; overflow: hidden">
    <div style="display: flex; align-items: center; padding: 12px 8px 4px 20px">
      <h1 style="flex: 1; margin: 0; font-size: 19px; font-weight: 600">Filter shops</h1>
      <a href="Today.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #44403C"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 20px">
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600; color: #44403C">Visit status</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #8B1D1D; background: #F8E8E8; color: #8B1D1D; font: inherit; font-size: 14px; font-weight: 600">Not visited</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">Ordered</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">Billed</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">Collected</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">No order</button>
        </div>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; margin-bottom: 4px">
          <legend style="flex: 1; padding: 0; font-size: 14px; font-weight: 600; color: #44403C">Beat</legend>
          <button type="button" style="height: 36px; padding: 0 8px; border: 0; background: transparent; color: #8B1D1D; font: inherit; font-size: 14px; font-weight: 600">Select all</button>
          <button type="button" style="height: 36px; padding: 0 8px; border: 0; background: transparent; color: #8B1D1D; font: inherit; font-size: 14px; font-weight: 600">Clear</button>
        </div>
        <label style="display: flex; align-items: center; gap: 12px; height: 46px; border-top: 1px solid #F1EDE4; font-size: 15px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #8B1D1D"><span style="flex: 1">Rasipuram Road</span><span style="font-size: 13px; color: #57534E">12 shops</span></label>
        <label style="display: flex; align-items: center; gap: 12px; height: 46px; border-top: 1px solid #F1EDE4; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #8B1D1D"><span style="flex: 1">Salem Road</span><span style="font-size: 13px; color: #57534E">9 shops</span></label>
        <label style="display: flex; align-items: center; gap: 12px; height: 46px; border-top: 1px solid #F1EDE4; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #8B1D1D"><span style="flex: 1">Mohanur Road</span><span style="font-size: 13px; color: #57534E">14 shops</span></label>
        <label style="display: flex; align-items: center; gap: 12px; height: 46px; border-top: 1px solid #F1EDE4; border-bottom: 1px solid #F1EDE4; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #8B1D1D"><span style="flex: 1">Paramathi Road</span><span style="font-size: 13px; color: #57534E">11 shops</span></label>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
        <legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600; color: #44403C">Customer group <span style="font-weight: 400; color: #57534E">· none picked = all</span></legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">Retail</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">Wholesale</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">Hotel</button>
        </div>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
        <legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600; color: #44403C">Dues</legend>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #D6D3D1; border-radius: 10px; overflow: hidden">
          <button type="button" aria-pressed="true" style="height: 40px; border: 0; background: #8B1D1D; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">Any</button>
          <button type="button" aria-pressed="false" style="height: 40px; border: 0; border-left: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">Outstanding</button>
          <button type="button" aria-pressed="false" style="height: 40px; border: 0; border-left: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font: inherit; font-size: 14px">Overdue</button>
        </div>
      </fieldset>
    </div>

    <footer style="border-top: 1px solid #E7E5E4; padding: 12px 16px; display: flex; gap: 10px">
      <button type="button" style="flex: 1; height: 48px; border-radius: 12px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #8B1D1D; font: inherit; font-size: 16px; font-weight: 600">Clear all</button>
      <a href="Today.dc.html" style="flex: 2; height: 48px; border-radius: 12px; background: #8B1D1D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Show 8 shops</a>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
